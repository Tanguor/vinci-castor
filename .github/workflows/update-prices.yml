# Relève les cours VINCI chaque soir de bourse et publie site/ sur GitHub Pages
name: Mise à jour des cours

on:
  schedule:
    - cron: "30 17 * * 1-5"   # 17 h 30 UTC, après la clôture d'Euronext Paris
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relever les cours (Yahoo Finance)
        run: python update_prices.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
